
name: Build Personal Ledger APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Linux dependencies with retries
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "APT update attempt $attempt"

            if sudo apt-get \
              -o Acquire::Retries=5 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep 20
          done

          sudo apt-get \
            -o Acquire::Retries=5 \
            install -y \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33"

      - name: Compile Android APK
        run: buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: personal-ledger-android-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
